# Frontend-specific Render configuration file
# If using this file, place it in the Views directory as the root directory configuration

services:
  - type: web
    name: fruit-order-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false

