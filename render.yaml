# Render 部署配置文件 - 合併部署（前端+後端單一服務）
# 此配置用於自動化部署配置
# 你也可以在 Render 網頁界面手動配置

services:
  # 合併部署：前端和後端在同一個服務中
  - type: web
    name: fruit-order-system
    env: node
    region: singapore  # 可選：singapore, oregon, frankfurt 等
    plan: free  # 或 starter, standard 等付費方案
    buildCommand: node build.js
    startCommand: cd js_server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVE_FRONTEND
        value: "true"  # 必須設置為 true 以啟用前端服務
      - key: ATLAS_URL
        sync: false  # 需要在 Render 界面手動設置 MongoDB 連接字串
      - key: REACT_APP_API_URL
        sync: false  # 合併部署可以留空（使用相對路徑）
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false  # 需要在 Render 界面手動設置（如果使用 Google OAuth）
      - key: GOOGLE_CLIENT_ID
        sync: false  # 需要在 Render 界面手動設置（必須與 REACT_APP_GOOGLE_CLIENT_ID 相同）
      - key: ALLOWED_ORIGINS
        sync: false  # 可選：如果需要額外的 CORS 設定
    # rootDir 留空，使用根目錄

