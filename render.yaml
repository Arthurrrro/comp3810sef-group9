# Render deployment configuration file - Combined deployment (frontend + backend single service)
# This configuration is used for automated deployment configuration
# You can also configure manually in the Render web interface

services:
  # Combined deployment: Frontend and backend in the same service
  - type: web
    name: fruit-order-system
    env: node
    region: singapore  # Optional: singapore, oregon, frankfurt, etc.
    plan: free  # Or starter, standard, etc. paid plans
    buildCommand: node build.js
    startCommand: cd js_server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVE_FRONTEND
        value: "true"  # Must be set to true to enable frontend service
      - key: ATLAS_URL
        sync: false  # Need to manually set MongoDB connection string in Render interface
      - key: REACT_APP_API_URL
        sync: false  # Can be left empty for combined deployment (uses relative path)
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false  # Need to manually set in Render interface (if using Google OAuth)
      - key: GOOGLE_CLIENT_ID
        sync: false  # Need to manually set in Render interface (must be the same as REACT_APP_GOOGLE_CLIENT_ID)
      - key: ALLOWED_ORIGINS
        sync: false  # Optional: If additional CORS configuration is needed
    # rootDir should be empty, use root directory

