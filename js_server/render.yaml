# Backend-specific Render configuration file
# If using this file, place it in the js_server directory as the root directory configuration

services:
  - type: web
    name: fruit-order-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ATLAS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

